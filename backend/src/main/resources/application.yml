server:
  port: ${PORT:8080}
spring:
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/netradb}
llm:
  base-url: ${LLM_BASE_URL:https://api.groq.com/openai/v1}
  api-key: ${LLM_API_KEY:}
  model: ${LLM_MODEL:llama-3.3-70b-versatile}
app:
  cors-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5500,http://localhost:8080}
admin:
  email: ${ADMIN_EMAIL:}
  password: ${ADMIN_PASSWORD:}
logging:
  level:
    org.springframework.data.mongodb.core.MongoTemplate: DEBUG
